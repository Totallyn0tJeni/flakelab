[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flakelab"
version = "0.0.1"
description = "Diagnose why a pytest test is flaky, with a minimal reproduction."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jenisha Patel" }]
requires-python = ">=3.10"
dependencies = ["pytest>=7"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/flakelab"]

[tool.pytest.ini_options]
# The zoo is deliberately flaky, so it is never collected by a plain `pytest`.
# tests/test_zoo_is_flaky.py runs zoo tests in subprocesses instead.
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]
